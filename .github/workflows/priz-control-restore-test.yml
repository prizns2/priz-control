name: PRIZ Control Restore Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    name: Restore latest backup into test Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      RESTORE_TEST_DB_URL: ${{ secrets.RESTORE_TEST_DB_URL }}
      B2_BUCKET: ${{ secrets.B2_BACKUP_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_BACKUP_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_BACKUP_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_BACKUP_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.B2_BACKUP_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for var in RESTORE_TEST_DB_URL B2_BUCKET B2_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is not configured"
              exit 1
            fi
          done

      - name: Find latest daily backup
        shell: bash
        run: |
          set -euo pipefail
          LATEST_KEY="$(
            aws s3 ls "s3://${B2_BUCKET}/daily/" \
              --recursive \
              --endpoint-url "$B2_ENDPOINT" \
            | awk '$4 ~ /\.tar\.gz$/ {print $1" "$2" "$4}' \
            | sort \
            | tail -n 1 \
            | awk '{print $3}'
          )"

          if [ -z "$LATEST_KEY" ]; then
            echo "::error::No daily .tar.gz backup found in Backblaze"
            exit 1
          fi

          echo "Latest backup: $LATEST_KEY"
          echo "LATEST_KEY=$LATEST_KEY" >> "$GITHUB_ENV"

      - name: Download backup and checksum
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp \
            "s3://${B2_BUCKET}/${LATEST_KEY}" \
            backup.tar.gz \
            --endpoint-url "$B2_ENDPOINT"

          aws s3 cp \
            "s3://${B2_BUCKET}/${LATEST_KEY}.sha256" \
            backup.tar.gz.sha256 \
            --endpoint-url "$B2_ENDPOINT"

      - name: Verify SHA-256
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="$(awk '{print $1}' backup.tar.gz.sha256)"
          ACTUAL="$(sha256sum backup.tar.gz | awk '{print $1}')"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Backup checksum mismatch"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

          echo "Checksum verified successfully"

      - name: Extract backup
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p restore
          tar -xzf backup.tar.gz -C restore

          ROLES="$(find restore -type f -name roles.sql -print -quit)"
          SCHEMA="$(find restore -type f -name schema.sql -print -quit)"
          DATA="$(find restore -type f -name data.sql -print -quit)"

          if [ -z "$ROLES" ] || [ -z "$SCHEMA" ] || [ -z "$DATA" ]; then
            echo "::error::roles.sql, schema.sql or data.sql is missing"
            find restore -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ROLES_FILE=$ROLES" >> "$GITHUB_ENV"
          echo "SCHEMA_FILE=$SCHEMA" >> "$GITHUB_ENV"
          echo "DATA_FILE=$DATA" >> "$GITHUB_ENV"

      - name: Restore into test database
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -e RESTORE_TEST_DB_URL \
            -e ROLES_FILE \
            -e SCHEMA_FILE \
            -e DATA_FILE \
            -v "$PWD:/work" \
            -w /work \
            postgres:17-alpine \
            sh -lc '
              psql \
                --single-transaction \
                --variable ON_ERROR_STOP=1 \
                --file "$ROLES_FILE" \
                --file "$SCHEMA_FILE" \
                --command "SET session_replication_role = replica" \
                --file "$DATA_FILE" \
                --dbname "$RESTORE_TEST_DB_URL"
            '

      - name: Basic restore verification
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -e RESTORE_TEST_DB_URL \
            postgres:17-alpine \
            sh -lc '
              psql "$RESTORE_TEST_DB_URL" \
                --tuples-only \
                --no-align \
                --command "
                  select count(*)
                  from information_schema.tables
                  where table_schema = '\''public'\''
                    and table_type = '\''BASE TABLE'\'';
                "
            '

          echo "Restore workflow completed successfully."
