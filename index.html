  <script>
    window.prizCaptchaToken = null;
    window.prizTurnstileSuccess = function(token) {
      window.prizCaptchaToken = token;
      const btn = document.getElementById('loginBtn');
      if (btn) btn.disabled = false;
    };
    window.prizTurnstileReset = function() {
      window.prizCaptchaToken = null;
      const btn = document.getElementById('loginBtn');
      if (btn) btn.disabled = true;
    };
  </script>

  <style>
    .mfa-view{min-height:100vh;display:grid;place-items:center;padding:24px;background:#090a0f;color:#fff;box-sizing:border-box}
    .mfa-shell{width:min(440px,100%);display:grid;gap:16px;justify-items:center}
    .mfa-card{width:100%;background:#11131a;border:1px solid #2a2d38;border-radius:18px;padding:26px;box-sizing:border-box;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .mfa-card h2{margin:4px 0 8px}.mfa-card p{line-height:1.5}.mfa-card .mfa-qr{display:block;width:220px;max-width:100%;margin:18px auto;background:#fff;border-radius:12px;padding:10px;box-sizing:border-box}.mfa-card .mfa-qr svg{display:block;width:100%;height:auto}
    .mfa-code{width:100%;font-size:22px;letter-spacing:5px;text-align:center;box-sizing:border-box}
    .mfa-secret{margin-top:12px;padding:10px 12px;border:1px solid #2a2d38;border-radius:10px;background:#0b0d12;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12px}
    .mfa-actions{display:grid;gap:10px;margin-top:16px}
  </style>

<body>
  <script>
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', () => {
        document.body.innerHTML = `<div style="font-family:Segoe UI,Arial,sans-serif;background:#090a0f;color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box"><div style="max-width:620px;background:#11131a;border:1px solid #2a2d38;border-radius:18px;padding:28px"><div style="font-weight:800;font-size:24px;margin-bottom:10px">PRIZ Control нужно запускать через START.bat</div><div style="color:#aeb4c4;line-height:1.55">Прямой запуск <b>index.html</b> открывает адрес <b>file://</b>. Из-за этого браузер не сможет отправлять фото и видео в Backblaze. Закрой эту вкладку и дважды нажми <b>START.bat</b> — приложение откроется по адресу <b>http://localhost:3000</b>.</div></div></div>`;
      });
    }
  </script>
  <div id="toast" class="toast"></div>

  <section id="loginView" class="login-view">
    <div class="login-shell">
      <div class="brand-mark">P</div>
      <div class="login-card">
        <div class="eyebrow">PRIZ CONTROL</div>
        <h1>Контроль нарушений</h1>
        <p class="muted">Серверная версия · Supabase + Backblaze B2</p>
        <form id="loginForm" class="stack-lg">
          <label>Логин<input id="loginUser" autocomplete="username" placeholder="prizns" required></label>
          <label>Пароль<input id="loginPass" type="password" autocomplete="current-password" placeholder="Ваш пароль" required></label>
          <div class="cf-turnstile"
               data-sitekey="0x4AAAAAAErcWrEeyY3sR1Sw"
               data-theme="dark"
               data-callback="prizTurnstileSuccess"
               data-expired-callback="prizTurnstileReset"
               data-error-callback="prizTurnstileReset"></div>
          <button class="btn primary wide" type="submit" id="loginBtn" disabled>Войти</button>
        </form>
        <div class="demo-box online-box">
          <b>Онлайн-база</b>
          <div class="muted small">Записи и аккаунты хранятся в Supabase. Фото и видео — в закрытом Backblaze B2.</div>
        </div>
      </div>
    </div>
  </section>

        <div class="top-actions">

      <h3 id="confirmTitle">Подтверждение</h3>
      <p id="confirmText" class="muted"></p>
      <div class="dialog-actions"><button value="cancel" class="btn ghost">Отмена</button><button id="confirmOk" value="ok" class="btn danger">Удалить</button></div>
    </form>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!--
  Load order matters: every file below except app.js is a "patch" — it
  reassigns a global function (go, buildShell, loadProfile, renderRecords,
  sb.rpc, ...) that a file loaded earlier already defined, wrapping it with
  extra behavior and calling the original inside. Reordering these tags can
  silently break a feature (a later patch stops seeing an earlier one's
  wrapper). ?v= is a content hash, not a date — never hand-edit it, run
  `python scripts/bump_versions.py` after touching any of these files and
  commit the resulting index.html diff (CI fails otherwise, see
  .github/workflows/verify-asset-versions.yml).

  app.js                        core app: auth/login, routing (go/buildShell),
                                 dashboard, records CRUD, base renderers.
  backup-monitor.js             owner "Управление": Supabase->B2 backup status card.
  attendance.js                 Табель: grid rendering, per-cell edit rights
                                 (owner/senior only), locked-cell toast.
  attendance-fast.js            Табель: keyboard-driven quick status entry.
  manager-access.js             adds role='manager': profile loading scoped to
                                 a linked managers row instead of a region.
  shared-operator-account.js    shared regional operator accounts: the
                                 "кто сейчас работает" picker + persistence.
  shared-region-switch.js       region handling for shared operator accounts.
  manager-ui.js                 manager role UI: "Мои записи" view, patches
                                 go/buildShell/renderRecords/recordsTable.
  manager-notifications.js      manager notification bell + dropdown.
  manager-receipt-sync.js       manager "Добавить чек" receipt upload flow.
  ops-manager-ui.js             adds role='ops_manager': region-wide read-only
                                 reviewer, no dashboard/Табель/receipts/notifs.
  server-status-owner-only.js   hides the "Сервер подключён" badge from
                                 non-owner roles.
  records-view-v5.js            records table/list rendering.
  records-category-filter.js    category tabs/filters on the records views.
  login-cleanup.js              tidies the login view on show/hide.
  audit-history-enhancements.js История изменений: action titles, value/diff
                                 formatting for audit_log entries.
  deletion-requests.js          Заявки на удаление page (senior/boss/owner).
  operator-media-save-fix.js    guards the upload-helper element from being
                                 removed by mistake during record save.
  operator-terminology.js       simplifies wording / hides technical record
                                 IDs for the operator role.
  operator-cleanup-fix.js       generic DOM cleanup pass for operator views.
  manager-autofill-fix.js       autofills Менеджер when Магазин is selected
                                 on the record form.
  regional-user-management.js   owner "Управление": account list, create/edit
                                 (calls the admin-users edge function).
  performance-cache.js          wraps sb.rpc with a short-lived read cache.
  live-refresh-fix.js           invalidates performance-cache entries after
                                 writes so lists reflect fresh data.
  navigation-stability.js       preserves scroll position across page/tab
                                 navigation.
  sidebar-icons.js              nav icon rendering/decoration.
  priz-exact-ui.js              the polished dashboard (stat cards, sparklines).
  role-ui-stability-fix.js      role-scoped region access stabilization,
                                 incl. attendance region restrictions.
-->

  <script>
    (() => {
      const originalSignInWithPassword = sb.auth.signInWithPassword.bind(sb.auth);
      sb.auth.signInWithPassword = async (credentials) => {
        const captchaToken = window.prizCaptchaToken;
        if (!captchaToken) throw new Error('Подтвердите, что вы не робот');
        try {
          return await originalSignInWithPassword({
            ...credentials,
            options: {
              ...(credentials?.options || {}),
              captchaToken
            }
          });
        } finally {
          window.prizTurnstileReset();
          if (window.turnstile) {
            try { window.turnstile.reset(); } catch (_) {}
          }
          setTimeout(() => {
            const btn = document.getElementById('loginBtn');
            if (btn && !window.prizCaptchaToken) btn.disabled = true;
          }, 0);
        }
      };

      const originalShowApp = showApp;
      const originalShowLogin = showLogin;
      let mfaGateRunning = false;

      function hideMfa() {
        document.getElementById('mfaView')?.classList.add('hidden');
      }
      function showMfa() {
        document.getElementById('loginView')?.classList.add('hidden');
        document.getElementById('appView')?.classList.add('hidden');
        document.getElementById('mfaView')?.classList.remove('hidden');
      }
      function setMfaBusy(btn, busy, text='Проверяем…') {
        if (!btn) return;
        if (busy) { btn.dataset.oldText = btn.textContent; btn.textContent = text; btn.disabled = true; }
        else { btn.textContent = btn.dataset.oldText || btn.textContent; btn.disabled = false; }
      }
      async function logoutFromMfa() {
        await sb.auth.signOut();
        currentUser = null;
        hideMfa();
        originalShowLogin();
        if (window.turnstile) { try { window.turnstile.reset(); } catch (_) {} }
      }
      document.getElementById('mfaLogoutBtn').onclick = logoutFromMfa;

      async function showTotpChallenge(factor) {
        showMfa();
        document.getElementById('mfaTitle').textContent = 'Введите код 2FA';
        document.getElementById('mfaText').textContent = 'Откройте приложение-аутентификатор и введите текущий 6-значный код.';
        const body = document.getElementById('mfaBody');
        body.innerHTML = `<form id="mfaChallengeForm" class="stack-lg"><label>Код из приложения<input id="mfaChallengeCode" class="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required></label><button id="mfaChallengeBtn" class="btn primary wide" type="submit">Подтвердить</button></form>`;
        const form = document.getElementById('mfaChallengeForm');
        const codeInput = document.getElementById('mfaChallengeCode');
        codeInput.focus();
        form.onsubmit = async (e) => {
          e.preventDefault();
          const btn = document.getElementById('mfaChallengeBtn');
          const code = codeInput.value.replace(/\D/g,'').slice(0,6);
          if (code.length !== 6) { toast('Введите 6-значный код', true); return; }
          setMfaBusy(btn, true);
          try {
            const { data: challenge, error: cErr } = await sb.auth.mfa.challenge({ factorId: factor.id });
            if (cErr) throw cErr;
            const { error: vErr } = await sb.auth.mfa.verify({ factorId: factor.id, challengeId: challenge.id, code });
            if (vErr) throw vErr;
            const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
            if (aal?.currentLevel !== 'aal2') throw new Error('Не удалось подтвердить второй фактор');
            hideMfa();
            originalShowApp();
          } catch (err) {
            codeInput.value = '';
            codeInput.focus();
            toast('Неверный или просроченный код 2FA', true);
          } finally { setMfaBusy(btn, false); }
        };
      }

      async function showTotpEnrollment(existingFactors=[]) {
        showMfa();
        document.getElementById('mfaTitle').textContent = 'Настройка 2FA для владельца';
        document.getElementById('mfaText').textContent = 'Отсканируйте QR-код в Google Authenticator, Microsoft Authenticator, 1Password или другом TOTP-приложении. После этого введите 6-значный код.';
        const body = document.getElementById('mfaBody');
        body.innerHTML = '<div class="muted">Создаём защищённый фактор…</div>';
        try {
          for (const f of existingFactors.filter(x => x.status !== 'verified')) {
            try { await sb.auth.mfa.unenroll({ factorId: f.id }); } catch (_) {}
          }
          const { data: enrolled, error: eErr } = await sb.auth.mfa.enroll({ factorType: 'totp' });
          if (eErr) throw eErr;
          const factorId = enrolled.id;
          const qr = enrolled.totp?.qr_code || '';
          const secret = enrolled.totp?.secret || '';
          body.innerHTML = `<div class="mfa-qr" role="img" aria-label="QR-код 2FA">${qr}</div><label>Код из приложения<input id="mfaEnrollCode" class="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required></label><div class="mfa-secret"><b>Резервный ключ:</b><br>${secret}</div><div class="muted small" style="margin-top:8px">Не отправляйте QR-код и резервный ключ другим людям.</div><button id="mfaEnrollBtn" class="btn primary wide" type="button" style="margin-top:16px">Включить 2FA</button>`;
          const codeInput = document.getElementById('mfaEnrollCode');
          const btn = document.getElementById('mfaEnrollBtn');
          codeInput.focus();
          btn.onclick = async () => {
            const code = codeInput.value.replace(/\D/g,'').slice(0,6);
            if (code.length !== 6) { toast('Введите 6-значный код', true); return; }
            setMfaBusy(btn, true, 'Включаем…');
            try {
              const { data: challenge, error: cErr } = await sb.auth.mfa.challenge({ factorId });
              if (cErr) throw cErr;
              const { error: vErr } = await sb.auth.mfa.verify({ factorId, challengeId: challenge.id, code });
              if (vErr) throw vErr;
              const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
              if (aal?.currentLevel !== 'aal2') throw new Error('Не удалось получить AAL2');
              toast('2FA включена');
              hideMfa();
              originalShowApp();
            } catch (err) {
              codeInput.value = '';
              codeInput.focus();
              toast('Код не подошёл. Введите новый код из приложения.', true);
            } finally { setMfaBusy(btn, false); }
          };
        } catch (err) {
          console.error(err);
          body.innerHTML = '<div class="empty"><b>Не удалось настроить 2FA</b>Выйдите из аккаунта и попробуйте снова.</div>';
        }
      }

      async function ownerMfaGate() {
        if (mfaGateRunning) return;
        if (!currentUser || currentUser.role !== 'owner') { hideMfa(); originalShowApp(); return; }
        mfaGateRunning = true;
        try {
          const [{ data: aal, error: aalErr }, { data: factors, error: fErr }] = await Promise.all([
            sb.auth.mfa.getAuthenticatorAssuranceLevel(),
            sb.auth.mfa.listFactors()
          ]);
          if (aalErr) throw aalErr;
          if (fErr) throw fErr;
          const totp = factors?.totp || [];
          const verified = totp.filter(f => f.status === 'verified');
          if (verified.length && aal?.currentLevel === 'aal2') { hideMfa(); originalShowApp(); return; }
          if (verified.length) { await showTotpChallenge(verified[0]); return; }
          await showTotpEnrollment(totp);
        } catch (err) {
          console.error(err);
          showMfa();
          document.getElementById('mfaTitle').textContent = 'Ошибка проверки 2FA';
          document.getElementById('mfaText').textContent = 'Не удалось проверить дополнительную защиту. Выйдите из аккаунта и попробуйте снова.';
          document.getElementById('mfaBody').innerHTML = '';
        } finally { mfaGateRunning = false; }
      }

      showLogin = function() {
        hideMfa();
        originalShowLogin();
      };
      showApp = function() {
        ownerMfaGate();
      };
    })();
  </script>
